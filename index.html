<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Комплексное меню — Отдохни в Тирляне</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Базовый размер шрифта */
html {
  font-size: 16px;
}

:root {
  --bg-color: #f1e9db;
  --card-bg: rgba(255, 255, 255, 0.75);
  --text-main: #3d352e;
  --text-muted: #73675c;
  --accent-brown: #8c5a3c;
  --accent-brown-hover: #73482f;
  --border-color: #d9cebe;
  --input-bg: #fcfaf7;
  --error-color: #aa3838;
}

* { 
  box-sizing: border-box; 
}

body {
  margin: 0;
  padding: 0;
  background-color: var(--bg-color);
  color: var(--text-main);
  font-family: 'Montserrat', sans-serif, Arial;
  background-image: 
    radial-gradient(#e2d5c3 15%, transparent 16%),
    radial-gradient(#ebdccb 15%, transparent 16%);
  background-size: 60px 60px;
  background-position: 0 0, 30px 30px;
  min-height: 100vh;
}

.container {
  max-width: 640px;
  margin: 0 auto;
  padding: 24px 16px;
}

.card {
  background: var(--card-bg);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border-radius: 20px;
  padding: 28px 24px;
  margin-bottom: 20px;
  box-shadow: 0 8px 20px rgba(0, 0, 0, 0.03);
  border: 1px solid rgba(255, 255, 255, 0.6);
  text-align: center;
}

.welcome-emoji {
  font-size: 2rem;
  margin-bottom: 8px;
}

h1 {
  font-size: 1.4rem;
  font-weight: 700;
  margin: 0 0 12px 0;
  color: #2b231d;
}

h2 {
  font-size: 1.25rem;
  font-weight: 700;
  margin: 0 0 16px 0;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}

h3 {
  font-size: 0.95rem;
  font-weight: 600;
  margin: 20px 0 10px 0;
  text-align: left;
  color: var(--text-main);
  display: flex;
  align-items: center;
  gap: 8px;
}

.intro {
  font-size: 0.9rem;
  color: var(--text-muted);
  line-height: 1.5;
  margin-bottom: 16px;
}

.field {
  margin-bottom: 20px;
  text-align: left;
}

.field label {
  display: block;
  font-size: 0.9rem;
  font-weight: 600;
  margin-bottom: 8px;
  color: var(--text-main);
}

input[type="text"], input[type="date"], input[type="time"] {
  width: 100%;
  border: 1px solid var(--border-color);
  border-radius: 12px;
  padding: 14px 16px;
  font-size: 0.95rem;
  font-family: inherit;
  background-color: var(--input-bg);
  color: var(--text-main);
  outline: none;
  transition: all 0.2s ease;
}

input[type="text"]:focus, input[type="date"]:focus, input[type="time"]:focus {
  border-color: var(--accent-brown);
  background-color: #fff;
  box-shadow: 0 0 0 3px rgba(140, 90, 60, 0.12);
}

.option {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 14px 16px;
  border: 1px solid var(--border-color);
  border-radius: 12px;
  margin: 8px 0;
  cursor: pointer;
  background-color: var(--input-bg);
  transition: all 0.15s ease;
  text-align: left;
  font-size: 0.9rem;
}

.option:hover {
  border-color: #c4b5a2;
  background-color: #fff;
}

.option:has(input:checked) {
  border-color: var(--accent-brown);
  background-color: #fff;
  box-shadow: 0 2px 8px rgba(140, 90, 60, 0.08);
}

input[type="radio"], input[type="checkbox"] {
  appearance: none;
  -webkit-appearance: none;
  width: 20px;
  height: 20px;
  border: 2px solid var(--border-color);
  border-radius: 50%;
  outline: none;
  margin: 0;
  cursor: pointer;
  display: grid;
  place-content: center;
  flex-shrink: 0;
}

input[type="checkbox"] {
  border-radius: 6px;
}

input[type="radio"]::before, input[type="checkbox"]::before {
  content: "";
  width: 10px;
  height: 10px;
  border-radius: 50%;
  transform: scale(0);
  transition: 120ms transform ease-in-out;
  background-color: var(--accent-brown);
}

input[type="checkbox"]::before {
  border-radius: 2px;
}

input[type="radio"]:checked, input[type="checkbox"]:checked {
  border-color: var(--accent-brown);
}

input[type="radio"]:checked::before, input[type="checkbox"]:checked::before {
  transform: scale(1);
}

button {
  border: 0;
  border-radius: 12px;
  padding: 16px 24px;
  font-size: 0.95rem;
  font-weight: 600;
  font-family: inherit;
  cursor: pointer;
  transition: all 0.2s ease;
}

button:disabled {
  opacity: 0.6;
  cursor: not-allowed;
}

.btn-primary {
  background-color: var(--accent-brown);
  color: #fff;
  width: 100%;
}

.btn-primary:hover:not(:disabled) {
  background-color: var(--accent-brown-hover);
}

.btn-secondary {
  background-color: #e5dbc9;
  color: var(--text-main);
  flex: 1;
}

.btn-secondary:hover {
  background-color: #d8ccb8;
}

.timebox {
  background-color: rgba(235, 225, 210, 0.4);
  border-radius: 14px;
  padding: 16px;
  margin: 14px 0 20px;
  text-align: left;
}

.timebox strong {
  display: block;
  font-size: 0.85rem;
  margin-bottom: 10px;
  color: var(--text-muted);
}

.datetime {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}

.icon-header {
  font-size: 1.75rem;
  margin-bottom: 8px;
  display: block;
}

.error {
  color: var(--error-color);
  font-size: 0.85rem;
  margin-top: 8px;
  text-align: left;
}

.summary {
  white-space: pre-wrap;
  background: var(--input-bg);
  border: 1px solid var(--border-color);
  border-radius: 14px;
  padding: 16px;
  font-size: 0.9rem;
  line-height: 1.6;
  text-align: left;
}

.actions {
  display: flex;
  gap: 10px;
  margin-top: 12px;
}

.hidden { display: none !important; }

/* === АДАПТИВНОСТЬ ПОД РАЗНЫЕ УСТРОЙСТВА === */

/* Компьютеры и большие экраны (> 768px) */
@media (min-width: 769px) {
  html {
    font-size: 17px;
  }
  .container {
    max-width: 680px;
    padding: 36px 20px;
  }
  .card {
    padding: 32px 28px;
    border-radius: 24px;
  }
}

/* Планшеты (481px - 768px) */
@media (max-width: 768px) and (min-width: 481px) {
  .container {
    padding: 20px 16px;
  }
  .card {
    padding: 24px 20px;
  }
}

/* Смартфоны (до 480px) */
@media (max-width: 480px) {
  html {
    font-size: 15px;
  }
  .container {
    padding: 12px 10px;
  }
  .card {
    padding: 20px 14px;
    border-radius: 16px;
    margin-bottom: 14px;
  }
  .datetime {
    grid-template-columns: 1fr;
    gap: 8px;
  }
  .option {
    padding: 12px 12px;
  }
  button {
    padding: 14px 18px;
  }
}
</style>
</head>
<body>

<div class="container">
  <!-- Приветственный экран -->
  <section id="welcome" class="card">
    <div class="welcome-emoji">👋</div>
    <h1>Отдохни в Тирляне приветствует Вас!</h1>
    <p class="intro">Пожалуйста, выберите в меню понравившиеся позиции.<br>Приятного аппетита!</p>
    <button id="startBtn" class="btn-primary" type="button">Начать</button>
  </section>

  <!-- Форма заказа -->
  <form id="orderForm" class="hidden">
    <section class="card">
      <div class="icon-header">📝</div>
      <h2>Комплексное меню</h2>
      <div class="field">
        <label>Пожалуйста, подскажите нам ваше имя *</label>
        <input id="clientName" type="text" placeholder="Укажите свое имя" required>
      </div>
      <div class="field">
        <label>Телефон или Telegram для связи *</label>
        <input id="contact" type="text" placeholder="+7... или @username" required>
      </div>
      <div class="field">
        <label>Что будем заказывать? *</label>
        <div id="meals"></div>
        <div id="mealError" class="error hidden">Выберите хотя бы один приём пищи.</div>
      </div>
    </section>

    <!-- Сюда подгружаются разделы меню из Google Таблицы -->
    <div id="menuContainer">
      <div class="card"><p class="intro">Загрузка меню...</p></div>
    </div>

    <section class="card">
      <button id="submitBtn" class="btn-primary" type="submit">Сформировать заказ</button>
    </section>
  </form>

  <!-- Экран результата -->
  <section id="result" class="card hidden">
    <div class="welcome-emoji">🎉</div>
    <h2>Ваш заказ</h2>
    <div id="summary" class="summary"></div>
    <p class="intro" style="margin-top:12px;">Заказ успешно сохранён в Google Таблицу.</p>
    
    <div class="actions">
      <button id="copyBtn" class="btn-secondary" type="button">Скопировать</button>
      <button id="downloadBtn" class="btn-secondary" type="button">Скачать .txt</button>
    </div>
    <div class="actions">
      <button id="backBtn" class="btn-primary" type="button" style="margin-top:8px;">Изменить заказ</button>
    </div>
  </section>
</div>

<script>
const $ = id => document.getElementById(id);
let menuData = [];
let orderText = '';

const SECTION_ICONS = {
  'Завтрак': '🍳',
  'Обед': '🍲',
  'Ужин': '🥘',
  'Ланч бокс в поход': '🍔',
  'Обед в поход': '🍔'
};

const GROUP_ICONS = {
  'Основное блюдо': '🍲',
  'Первое': '🥣',
  'Второе': '🥩',
  'Гарнир': '🍟',
  'Салат': '🥗',
  'Дополнительно': '🥪',
  'Хлеб': '🍞',
  'Чай или кофе': '☕',
  'Чай или компот': '☕',
  'К чаю': '🍬',
  'Овощная тарелка': '🍅',
  'Сырная тарелка': '🧀',
  'Закуски': '🥪',
  'Фрукты': '🍌',
  'Фрукт или овощ': '🍎',
  'Сок или вода': '🧃'
};

document.addEventListener("DOMContentLoaded", function(){
  $("startBtn").addEventListener("click", showForm);
  $("orderForm").addEventListener("submit", function(e){ e.preventDefault(); makeOrder(); });
  $("copyBtn").addEventListener("click", copyOrder);
  $("downloadBtn").addEventListener("click", downloadOrder);
  $("backBtn").addEventListener("click", backToForm);
  $("meals").addEventListener("change", function(e){
    if(e.target && e.target.classList.contains("meal-check")){
      toggleMeal();
    }
  });
});

function showForm(){
  $("welcome").classList.add('hidden');
  $("orderForm").classList.remove('hidden');
  if(!menuData.length) loadMenu();
  scrollTo(0,0);
}

function loadMenu(){
  google.script.run
    .withSuccessHandler(renderMenu)
    .withFailureHandler(function(){
      $("menuContainer").innerHTML = '<div class="card error">Не удалось загрузить меню. Обновите страницу.</div>';
    })
    .getMenu();
}

function renderMenu(data){
  menuData = data || [];
  const mealNames = [...new Set(menuData.map(x => x.section))];
  const mealMap = {'Завтрак':'breakfast','Обед':'lunch','Ужин':'dinner','Ланч бокс в поход':'box'};
  
  $("meals").innerHTML = mealNames.map(s => {
    const id = mealMap[s] || slug(s);
    return `<label class="option"><input type="checkbox" name="meal" value="${esc(id)}" data-section="${esc(s)}" class="meal-check"><span>${esc(s)}</span></label>`;
  }).join('');
  
  buildSectionsHTML();
}

function buildSectionsHTML(){
  const sections = [...new Set(menuData.map(x => x.section))];
  const html = sections.map(section => {
    const rows = menuData.filter(x => x.section === section);
    const by = {};
    rows.forEach(x => (by[x.group] ??= []).push(x));
    const secIcon = SECTION_ICONS[section] || '🍽️';
    
    return `<section class="card meal-card hidden" id="meal-${slug(section)}" data-section="${esc(section)}">
      <div class="icon-header">${secIcon}</div>
      <h2>${esc(section)}</h2>
      
      <div class="timebox">
        <strong>⏰ Укажите дату и время</strong>
        <div class="datetime">
          <input type="date" class="meal-date" data-section="${esc(section)}">
          <input type="time" class="meal-time" data-section="${esc(section)}">
        </div>
        <div class="error hidden time-error">Укажите дату и время.</div>
      </div>

      ${Object.keys(by).map(g => {
        const type = by[g][0].type === 'несколько' ? 'checkbox' : 'radio';
        const name = 'grp_' + slug(section) + '_' + slug(g);
        const grpIcon = GROUP_ICONS[g] || '🔹';
        return `<div class="menu-group" data-section="${esc(section)}" data-group="${esc(g)}">
          <h3><span>${grpIcon}</span> ${esc(g)}</h3>${by[g].map(x => `<label class="option"><input type="${type}" name="${name}" value="${esc(x.name)}"><span>${esc(x.name)}</span></label>`).join('')}
          <div class="error group-error hidden">Выберите вариант.</div>
        </div>`;
      }).join('')}
    </section>`;
  }).join('');
  
  $("menuContainer").innerHTML = html;
}

function toggleMeal(){
  $("mealError").classList.add('hidden');
  const selectedSections = [...document.querySelectorAll('input[name="meal"]:checked')].map(x => x.dataset.section);
  
  document.querySelectorAll('.meal-card').forEach(card => {
    const section = card.dataset.section;
    if (selectedSections.includes(section)) {
      card.classList.remove('hidden');
    } else {
      card.classList.add('hidden');
    }
  });
}

function makeOrder(){
  const selected = [...document.querySelectorAll('input[name="meal"]:checked')];
  if(!selected.length){ $("mealError").classList.remove('hidden'); return; }
  
  let valid = true;
  const groups = [];
  
  selected.forEach(m => {
    const section = m.dataset.section;
    const card = document.querySelector('.meal-card[data-section="' + CSS.escape(section) + '"]');
    const d = card.querySelector('.meal-date').value;
    const t = card.querySelector('.meal-time').value;
    const te = card.querySelector('.time-error');
    
    te.classList.toggle('hidden', !!(d && t));
    if(!(d && t)) valid = false;
    
    card.querySelectorAll('.menu-group').forEach(g => {
      const checked = g.querySelectorAll('input:checked');
      const err = g.querySelector('.group-error');
      err.classList.toggle('hidden', checked.length > 0);
      if(!checked.length) valid = false;
      groups.push({section, group: g.dataset.group, items: [...checked].map(x => x.value), date: d, time: t});
    });
  });
  
  if(!valid){
    const bad = document.querySelector('.error:not(.hidden)');
    if(bad) bad.scrollIntoView({behavior:'smooth', block:'center'});
    return;
  }

  const name = $("clientName").value.trim();
  const phone = $("contact").value.trim();
  const byDate = {};
  
  groups.forEach(g => {
    const key = g.date + ' ' + g.time;
    if(!byDate[key]) byDate[key] = {date: g.date, time: g.time, meals: {}};
    (byDate[key].meals[g.section] ??= []).push(g);
  });

  let s = 'ЗАКАЗ — ОТДОХНИ В ТИРЛЯНЕ\n\n';
  s += 'Имя: ' + (name || 'не указано') + '\n';
  s += 'Телефон/Telegram: ' + (phone || 'не указано') + '\n\n';

  Object.values(byDate).sort((a,b) => (a.date + a.time).localeCompare(b.date + b.time)).forEach(d => {
    s += '════════════════════════════\n';
    s += formatDate(d.date) + ' — ' + d.time + '\n';
    s += '════════════════════════════\n';
    Object.keys(d.meals).forEach(sec => {
      s += '\n' + sec + '\n';
      d.meals[sec].forEach(g => s += '  ' + g.group + ': ' + g.items.join(', ') + '\n');
    });
    s += '\n';
  });
  s += 'Спасибо!';

  orderText = s;
  
  $("submitBtn").disabled = true;
  $("submitBtn").textContent = "Сохраняем заказ...";

  google.script.run
    .withSuccessHandler(function(res){
      $("submitBtn").disabled = false;
      $("submitBtn").textContent = "Сформировать заказ";
      $("summary").textContent = orderText + '\n\n✓ Заказ сохранён. Номер: ' + (res && res.orderNumber ? res.orderNumber : '—');
      $("orderForm").classList.add('hidden');
      $("result").classList.remove('hidden');
      scrollTo(0,0);
    })
    .withFailureHandler(function(err){
      $("submitBtn").disabled = false;
      $("submitBtn").textContent = "Сформировать заказ";
      alert('Не удалось сохранить заказ: ' + (err && err.message ? err.message : err));
    })
    .saveOrder({order: orderText});
}

function formatDate(v){
  const p = v.split('-'); return p.length === 3 ? p[2] + '.' + p[1] + '.' + p[0] : v;
}
function slug(s){ return String(s).toLowerCase().replace(/[^a-zа-яё0-9]+/gi, '_').replace(/^_|_$/g, ''); }
function esc(s){ return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function copyOrder(){
  if(navigator.clipboard){
    navigator.clipboard.writeText(orderText).then(() => alert('Заказ скопирован.'));
  } else {
    alert('Скопируйте заказ вручную.');
  }
}

function downloadOrder(){
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([orderText], {type: 'text/plain;charset=utf-8'}));
  a.download = 'zakaz-tirlyan.txt';
  a.click();
}

function backToForm(){
  $("result").classList.add('hidden');
  $("orderForm").classList.remove('hidden');
  scrollTo(0,0);
}
</script>
</body>
</html>

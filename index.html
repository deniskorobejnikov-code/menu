<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Отдохни в Тирляне — меню</title>
<style>
:root{--bg:#f5f3ee;--card:#fff;--text:#262626;--muted:#777;--accent:#315c42;--line:#e5e1d8;--err:#a32929}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,sans-serif}
.container{max-width:760px;margin:auto;padding:16px}
.card{background:var(--card);border-radius:18px;padding:22px;box-shadow:0 5px 25px #0000000d;margin-bottom:16px}
h1,h2,h3{margin-top:0}h1{font-size:30px;text-align:center}h2{font-size:23px;border-bottom:1px solid var(--line);padding-bottom:12px}
h3{font-size:18px;margin-top:22px;margin-bottom:10px}.intro{text-align:center;color:#555;line-height:1.55}.hidden{display:none!important}
.badge{display:inline-block;background:#e8efe9;color:#244733;border-radius:20px;padding:6px 10px;font-size:13px;margin-bottom:12px}
.field{margin:15px 0}.field>label:first-child{display:block;font-weight:bold;margin-bottom:7px}
input[type=text],input[type=date],input[type=time]{width:100%;border:1px solid #d7d3ca;border-radius:11px;padding:12px 13px;font-size:16px;background:#fff}
button{border:0;border-radius:12px;padding:14px 18px;font-size:16px;font-weight:bold;cursor:pointer}
.primary{background:var(--accent);color:#fff;width:100%;margin-top:8px}.secondary{background:#eeeae1;color:#333;margin:5px}
.option{display:flex;gap:12px;align-items:flex-start;padding:13px 10px;border:1px solid var(--line);border-radius:12px;margin:8px 0;cursor:pointer}
.option:has(input:checked){border-color:var(--accent);background:#f7faf7}
input[type=radio],input[type=checkbox]{margin-top:3px;accent-color:var(--accent);transform:scale(1.15)}
.timebox{background:#f7f5ef;border-radius:12px;padding:14px;margin:10px 0 16px}
.timebox strong{display:block;margin-bottom:9px}.datetime{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.error{color:var(--err);font-size:14px;margin-top:8px;font-weight:bold}.group-error{border:1px solid #e4aaaa;background:#fff6f6;padding:10px;border-radius:10px}
.small{font-size:13px;color:var(--muted);line-height:1.45}.summary{white-space:pre-wrap;background:#f7f5ef;border-radius:12px;padding:15px;line-height:1.55}
.actions{display:flex;flex-wrap:wrap;gap:6px}.actions button{flex:1;min-width:150px}
.loading{text-align:center;padding:25px;color:var(--muted)}
@media(max-width:520px){.card{padding:17px;border-radius:15px}.container{padding:10px}h1{font-size:25px}.datetime{grid-template-columns:1fr 1fr}.option{padding:12px 8px}}
</style>
</head>
<body>
<div class="container">
<section id="welcome" class="card">
<div class="badge">Меню заказа</div>
<h1>Отдохни в Тирляне<br>приветствует Вас!</h1>
<p class="intro">Выберите, что хотите заказать, укажите дату и время каждого выбранного приёма пищи и сформируйте заказ.</p>
<p class="intro"><b>Приятного аппетита!</b></p>
<button id="startBtn" class="primary" type="button">Начать</button>
</section>

<form id="orderForm" class="hidden">
<section class="card">
<h2>Общая информация</h2>
<div class="field">
<label>Что заказать?</label>
<div id="meals"></div>
<div id="mealError" class="error hidden">Выберите хотя бы один вариант.</div>
</div>
<div class="field"><label>Ваше имя</label><input id="clientName" type="text" placeholder="Введите имя"></div>
<div class="field"><label>Телефон или Telegram для связи</label><input id="contact" type="text" placeholder="+7... или @username"></div>
</section>

<div id="menuContainer"><div class="card loading">Загрузка меню…</div></div>

<section class="card">
<button class="primary" type="submit">Сформировать заказ</button>
</section>
</form>

<section id="result" class="card hidden">
<h2>Ваш заказ</h2>
<div id="summary" class="summary"></div>
<p class="small">Заказ сохранён в Google Таблицу.</p>
<div class="actions">
<button id="copyBtn" class="secondary" type="button">Скопировать</button>
<button id="downloadBtn" class="secondary" type="button">Скачать .txt</button>
</div>
<button id="backBtn" class="primary" type="button">Изменить заказ</button>
</section>
</div>

<script>
const $ = id => document.getElementById(id);
let menuData=[];
let orderText='';
let currentOrder={};

document.addEventListener("DOMContentLoaded", function(){
  $("startBtn").addEventListener("click", showForm);
  $("orderForm").addEventListener("submit", function(e){ e.preventDefault(); makeOrder(); });
  $("copyBtn").addEventListener("click", copyOrder);
  $("downloadBtn").addEventListener("click", downloadOrder);
  $("backBtn").addEventListener("click", backToForm);
  $("meals").addEventListener("change", function(e){
    if(e.target && e.target.classList.contains("meal-check")){
      toggleMeal();
    }
  });
});

function showForm(){
  $("welcome").classList.add('hidden');
  $("orderForm").classList.remove('hidden');
  if(!menuData.length) loadMenu();
  scrollTo(0,0);
}

const API_URL = 'https://script.google.com/macros/s/AKfycby-xhmu19HfXtNzLNAUeNro5dY24-mc8gH40G9-h4RV2wrq1nDxit8uoeiNBVwPmiYU/exec';

function callApi(params, onSuccess, onError){
  const callback = 'cb_' + Date.now() + '_' + Math.floor(Math.random()*1000000);
  const script = document.createElement('script');

  window[callback] = function(data){
    try {
      if (data && data.success === false) {
        if (onError) onError(data);
      } else {
        onSuccess(data);
      }
    } finally {
      delete window[callback];
      script.remove();
    }
  };

  script.onerror = function(){
    delete window[callback];
    script.remove();
    if (onError) onError(new Error('API connection failed'));
  };

  const query = new URLSearchParams({...params, callback});
  script.src = API_URL + '?' + query.toString();
  document.body.appendChild(script);
}

function loadMenu(){
  callApi(
    {api:'menu'},
    renderMenu,
    function(){
      $("menuContainer").innerHTML='<div class="card error">Не удалось загрузить меню. Обновите страницу.</div>';
    }
  );
}

function renderMenu(data){
  menuData=data||[];
  const mealNames=[...new Set(menuData.map(x=>x.section))];
  const mealMap={'Завтрак':'breakfast','Обед':'lunch','Ужин':'dinner','Обед в поход':'box'};
  $("meals").innerHTML=mealNames.map(s=>{
    const id=mealMap[s]||slug(s);
    return `<label class="option"><input type="checkbox" name="meal" value="${esc(id)}" data-section="${esc(s)}" class="meal-check"><span>${esc(s)}</span></label>`;
  }).join('');
  renderSections();
}

function renderSections(){
  const selected=[...document.querySelectorAll('input[name="meal"]:checked')].map(x=>x.dataset.section);
  const groups=[];
  selected.forEach(section=>{
    const rows=menuData.filter(x=>x.section===section);
    const by={};
    rows.forEach(x=>(by[x.group]??=[]).push(x));
    groups.push(`<section class="card meal-card" id="meal-${slug(section)}" data-section="${esc(section)}"><h2>${esc(section)}</h2>
      <div class="timebox"><strong>Дата и время</strong><div class="datetime">
      <input type="date" class="meal-date" data-section="${esc(section)}">
      <input type="time" class="meal-time" data-section="${esc(section)}">
      </div><div class="error hidden time-error">Укажите дату и время.</div></div>
      ${Object.keys(by).map(g=>{
        const type=by[g][0].type==='несколько'?'checkbox':'radio';
        const name='grp_'+slug(section)+'_'+slug(g);
        return `<div class="menu-group" data-section="${esc(section)}" data-group="${esc(g)}" data-type="${by[g][0].type}">
          <h3>${esc(g)}</h3>
          ${by[g].map(x=>`<label class="option"><input type="${type}" name="${name}" value="${esc(x.name)}"><span>${esc(x.name)}</span></label>`).join('')}
          <div class="error group-error hidden">Выберите ${type==='radio'?'одно блюдо':'минимум одно блюдо'}.</div>
        </div>`;
      }).join('')}
    </section>`);
  });
  $("menuContainer").innerHTML=groups.join('');
}

function toggleMeal(){
  $("mealError").classList.add('hidden');
  renderSections();
}

function makeOrder(){
  const selected=[...document.querySelectorAll('input[name="meal"]:checked')];
  if(!selected.length){$("mealError").classList.remove('hidden');return}
  let valid=true;
  const groups=[];
  selected.forEach(m=>{
    const section=m.dataset.section;
    const card=document.querySelector('.meal-card[data-section="'+CSS.escape(section)+'"]');
    const d=card.querySelector('.meal-date').value;
    const t=card.querySelector('.meal-time').value;
    const te=card.querySelector('.time-error');
    te.classList.toggle('hidden',!!(d&&t));
    if(!(d&&t)) valid=false;
    card.querySelectorAll('.menu-group').forEach(g=>{
      const checked=g.querySelectorAll('input:checked');
      const err=g.querySelector('.group-error');
      err.classList.toggle('hidden',checked.length>0);
      if(!checked.length) valid=false;
      groups.push({section,group:g.dataset.group,items:[...checked].map(x=>x.value),date:d,time:t});
    });
  });
  if(!valid){
    const bad=document.querySelector('.error:not(.hidden)');
    if(bad) bad.scrollIntoView({behavior:'smooth',block:'center'});
    return;
  }

  const name=$("clientName").value.trim();
  const phone=$("contact").value.trim();
  const byDate={};
  groups.forEach(g=>{
    const key=g.date+' '+g.time;
    if(!byDate[key]) byDate[key]={date:g.date,time:g.time,meals:{}};
    (byDate[key].meals[g.section]??=[]).push(g);
  });

  let s='ЗАКАЗ — ОТДОХНИ В ТИРЛЯНЕ\n\n';
  s+='Имя: '+(name||'не указано')+'\n';
  s+='Телефон/Telegram: '+(phone||'не указано')+'\n\n';

  Object.values(byDate).sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time)).forEach(d=>{
    s+='════════════════════════════\n';
    s+=formatDate(d.date)+' — '+d.time+'\n';
    s+='════════════════════════════\n';
    Object.keys(d.meals).forEach(sec=>{
      s+='\n'+sec+'\n';
      d.meals[sec].forEach(g=>s+='  '+g.group+': '+g.items.join(', ')+'\n');
    });
    s+='\n';
  });
  s+='Спасибо!';

  orderText=s;
  currentOrder={order:s,name,contact};
  $("summary").textContent='Сохраняем заказ…';
  callApi(
    {
      api:'saveOrder',
      order: currentOrder.order,
      name: currentOrder.name,
      contact: currentOrder.contact
    },
    function(res){
      $("summary").textContent=orderText+'\n\n✓ Заказ сохранён. Номер: '+res.orderNumber;
      $("orderForm").classList.add('hidden');$("result").classList.remove('hidden');scrollTo(0,0);
    },
    function(){
      $("summary").textContent=orderText+'\n\n⚠ Не удалось сохранить заказ. Попробуйте ещё раз.';
    }
  );
}

function formatDate(v){
  const p=v.split('-'); return p.length===3?p[2]+'.'+p[1]+'.'+p[0]:v;
}
function slug(s){return String(s).toLowerCase().replace(/[^a-zа-яё0-9]+/gi,'_').replace(/^_|_$/g,'')}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function copyOrder(){navigator.clipboard?navigator.clipboard.writeText(orderText).then(()=>alert('Заказ скопирован.')):alert('Скопируйте заказ вручную.')}
function downloadOrder(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([orderText],{type:'text/plain;charset=utf-8'}));a.download='zakaz-tirlyan.txt';a.click()}
function backToForm(){$("result").classList.add('hidden');$("orderForm").classList.remove('hidden');scrollTo(0,0)}
</script>
</body>
</html>
